name: Test & Stabilization Gates

on:
  push:
    branches: [ main, refactor/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Python syntax compilation check
      run: |
        python -m py_compile main.py app/*.py browser/*.py naver/*.py services/*.py services/comments/*.py ui/*.py tests/*.py

    - name: Run Unit & Regression Test Suite
      run: |
        python -m unittest discover -s tests -p "test_*.py"
